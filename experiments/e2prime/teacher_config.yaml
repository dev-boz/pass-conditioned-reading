# E2′ teacher data generation — Stage A (coupled schedule, explicit channel).
# DRAFT values: these freeze when data generation begins (docs/E2PRIME-PREREG.md §2/§4);
# any later change is a dated pre-run amendment. Nothing here may reference probe content
# (forcing boundary, E2PRIME-CRITERION §2) — audited, prompts archived per trajectory.

teacher:
  backend: claude_p          # ClaudePClient — Haiku 4.5 via `claude -p` (D29/D30 lineage)
  model: haiku
  timeout_s: 300

harness:
  guard: strict              # D31-amended E2′ guard mode
  op_cap: 24                 # per-pass applied-op cap (P6 fix lineage)
  state_budget_tok: 4000     # warn threshold rendered into the prompt (D28 lineage)

schedule:
  code:                      # P7 two-phase lineage (D25-D27)
    V: 3000
    R: 5
    stage_fracs: [0.34, 0.67]
  prose:                     # E0 lineage; views must be PRE-GENERATED by the frozen D29
    V: 512                   # compressor pipeline (gen_views_llm) — teacher_gen consumes them
    K: 8
    views_jsonl: data/views/views_haiku_merged.jsonl

task:
  # Need-class framing (legal side of the E2PRIME-CRITERION §2 boundary): names a class of
  # information needs; never a structure, identifier, or value.
  need_class: >-
    Downstream, operational questions about this document's specifics (exact values,
    mappings, procedures, and cross-references) will be answered from your state alone;
    the source will not be available.
  structural_objective: >-
    Maintain a bounded integration state that carries the document's global structure and
    the concrete specifics your entries claim to cover. The state must remain a faithful,
    self-contained representation of the document read so far.
  closing_demand: >-
    From your final state alone, write the analytical brief it supports: the document's
    structure, how its parts relate, and the concrete specifics recorded in your entries.

paths:
  corpus: data/e2prime/corpus.jsonl            # {"doc_id","kind":"code"|"prose","blocks"|"text"}
  out_trajectories: data/e2prime/trajectories  # one JSON per doc (resumable)
  out_rendered: data/e2prime/stageA_coupled.jsonl
